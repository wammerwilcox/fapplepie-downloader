name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install --require-hashes -r app/requirements.txt

      - name: Compile scraper
        run: /tmp/ci-venv/bin/python -m py_compile app/scraper.py

      - name: Run unit tests
        run: /tmp/ci-venv/bin/python -m unittest discover -v

      - name: Check installed packages
        run: /tmp/ci-venv/bin/python -m pip check

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker image
        run: docker build -t fapplepie-downloader-public-test .
